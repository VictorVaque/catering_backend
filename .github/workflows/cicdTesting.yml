name: CI y CD (Testing)

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # ==========================================
  # FASE 1: INTEGRACIÓN CONTINUA (CI)
  # ==========================================
  ci:
    runs-on: ubuntu-latest
    steps:
      # Pre: hace checkout del código que va a ser validado.
      # Post: el job trabaja sobre la versión correcta del repositorio.
      - uses: actions/checkout@v4

      # Pre: instala el JDK 17 para compilar la aplicación.
      # Post: la máquina queda lista para ejecutar Maven y pruebas de build.
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Pre: compila el proyecto sin ejecutar tests para validar la build base.
      # Post: si falla, el pipeline se detiene antes de empaquetar la imagen.
      - name: Compilar código
        run: mvn clean compile -DskipTests

      # Pre: ejecuta Checkstyle para detectar violaciones de estilo y calidad.
      # Post: el pipeline falla si hay errores de formato o reglas rotas.
      - name: Análisis de Formato y Linting
        run: mvn checkstyle:check

  # ==========================================
  # FASE 2: CONSTRUIR Y SUBIR IMAGEN DOCKER
  # ==========================================
  build-and-push:
    needs: [ci]
    runs-on: ubuntu-latest
    # outputs para que deploy-testing pueda leer el TAG
    outputs:
      TAG: ${{ steps.tag.outputs.TAG }}
    steps:
      # Pre: vuelve a descargar el código para construir la imagen Docker.
      # Post: el contexto de build queda alineado con el commit actual.
      - uses: actions/checkout@v4

      # Pre: genera un tag corto y único con base en el SHA del commit.
      # Post: el valor TAG queda disponible para los jobs siguientes.
      - name: Generar tag
        id: tag
        run: echo "TAG=v${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # iniciar sesión para subir a DockerHub
      # Pre: autentica en Docker Hub para permitir el push de la imagen.
      # Post: el runner queda autorizado para publicar la imagen de prueba.
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pre: construye la imagen de la aplicación y la envía al registry.
      # Post: la imagen de prueba queda publicada con el tag generado.
      - name: Build & Push imagen
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: asierhr/catering-back-test:${{ steps.tag.outputs.TAG }}

      # Pre: guarda el digest de la imagen construida en un archivo temporal.
      # Post: el digest puede reutilizarse en el despliegue y en el flujo de producción.
      - name: Guardar digest como artifact
        run: echo "${{ steps.build.outputs.digest }}" > digest-back.txt

      # Pre: publica el digest como artifact del workflow.
      # Post: el despliegue de otro workflow puede recuperar el mismo digest.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-back
          path: digest-back.txt

  # ==========================================
  # FASE 3: DESPLIEGUE CON HELM (TESTING)
  # ==========================================
  deploy-testing:
    needs: [build-and-push]
    runs-on: self-hosted   # Se ejecuta en el runner del master (sin VPN necesaria)
    environment: testing
    steps:
      # Pre: descarga el repositorio de infraestructura con los charts de Helm.
      # Post: el runner pasa a tener acceso a los manifiestos de despliegue.
      - name: Checkout Infraestructura
        uses: actions/checkout@v4
        with:
          repository: 'PTIN-projecte/infrastructure-devops'
          path: infra

      # Pre: instala Helm para ejecutar el despliegue en el clúster.
      # Post: el runner queda preparado para aplicar el chart.
      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.14.0'

      # Pre: ejecuta el upgrade/install de la release de prueba con el tag generado.
      # Post: la aplicación queda actualizada en el namespace testing.
      - name: Helm deploy testing
        run: |
          cd infra/Kubernetes/ptincatering
          helm upgrade --install ptin-test . \
            -f values.yaml \
            -f values-dev.yaml \
            --namespace testing \
            --create-namespace \
            --set back.image.tag=${{ needs.build-and-push.outputs.TAG }} \
            --wait \
            --timeout 5m0s
