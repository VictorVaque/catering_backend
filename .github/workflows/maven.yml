name: CI de Calidad y Seguridad (Backend)

on:
  push:
    branches: [ "develop"]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  analisis-estatico:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código del repositorio
    - uses: actions/checkout@v4

    # 2. Configurar el entorno Java 17
    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    # 3. Verificar que el código compila correctamente (sin ejecutar pruebas de BD)
    - name: Compilar código
      run: mvn clean compile -DskipTests

    # 4. Pruebas de Lint y Formato (Solo advertencias, no bloquea)
    # Nota: Utiliza el plugin Checkstyle de Maven
    - name: Análisis de Formato y Linting
      run: mvn checkstyle:check -Dcheckstyle.failOnViolation=false

    # 5. Escaneo de Vulnerabilidades (Seguridad)
    # Revisa si las librerías usadas tienen brechas de seguridad reportadas públicamente
    # - name: Escaneo de Vulnerabilidades (OWASP)
    #  run: mvn org.owasp:dependency-check-maven:check
