name: CD Production

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy-production:
    runs-on: self-hosted
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      # Pre: busca el artifact del workflow de testing asociado al commit correcto.
      # Post: el digest recuperado garantiza que la imagen promocionada es la correcta.
      - name: Download artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: cicdTesting.yml
          name: digest-back
          commit: main
          workflow_conclusion: success

      # Pre: lee el digest guardado en el artifact para reutilizarlo en Docker.
      # Post: el valor DIGEST queda disponible para el retag de la imagen.
      - name: Leer digest
        id: digest
        run: echo "DIGEST=$(cat digest-back.txt)" >> $GITHUB_OUTPUT

      # Pre: extrae la versión directamente del tag que disparó el CD.
      # Post: el versionado de la imagen de producción queda alineado con el release.
      - name: Extraer versión del tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # Pre: autentica en Docker Hub para permitir el push de la imagen de producción.
      # Post: el runner queda autorizado para publicar la nueva tag de la imagen.
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ptincatering
          password: ptincatering
          #username: ${{ secrets.DOCKERHUB_USERNAME }}
          #password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pre: reaprovecha el digest validado para crear la imagen de producción.
      # Post: la imagen se publica con la versión del tag del release.
      - name: Re-tag imagen para producción
        run: |
          docker pull asierhr/catering-back-test@${{ steps.digest.outputs.DIGEST }}
          docker tag asierhr/catering-back-test@${{ steps.digest.outputs.DIGEST }} \
            asierhr/catering-back:${{ steps.version.outputs.VERSION }}
          docker push asierhr/catering-back:${{ steps.version.outputs.VERSION }}

      # Pre: descarga los manifiestos del repositorio de infraestructura.
      # Post: el runner pasa a tener los charts necesarios para el despliegue.
      - name: Checkout Infraestructura
        uses: actions/checkout@v4
        with:
          repository: 'PTIN-projecte/infrastructure-devops'
          path: infra

      # Pre: aplica la release de producción con el nuevo tag.
      # Post: el namespace prod recibe la versión promovida.
      - name: Helm deploy production
        id: helm_deploy
        run: |
          cd infra/Kubernetes/ptincatering
          helm upgrade --install ptin-prod . \
            -f values.yaml \
            -f values-prod.yaml \
            --namespace prod \
            --set back.image.tag=${{ steps.version.outputs.VERSION }} \
            --wait \
            --timeout 5m0s

          # Pre: intenta restaurar la release anterior si falla el despliegue de producción.
          # Post: reduce el tiempo de indisponibilidad si el upgrade se rompe.
      - name: Rollback production deployment
        if: failure() && steps.helm_deploy.outcome == 'failure'
        run: |
          cd infra/Kubernetes/ptincatering
          if helm history ptin-prod --namespace prod >/dev/null 2>&1; then
            helm rollback ptin-prod --namespace prod --wait --timeout 5m0s
          fi