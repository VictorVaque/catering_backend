spring:
  application:
    name: ptincatering-backend
  db:
    write:
      url: ${SPRING_DATASOURCE_RW_URL}
    read:
      url: ${SPRING_DATASOURCE_RW_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
server:
  port: 8080

storage:
  location: /mnt/storage/imagenes