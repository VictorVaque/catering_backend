spring:
  config:
    import: "optional:file:.env[.properties]"
  db:
    write:
      url: jdbc:postgresql://192.168.10.10:30432/test
    read:
      url: jdbc:postgresql://192.168.10.10:30433/test
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: 8080

storage:
  location: /mnt/storage/imagenes
